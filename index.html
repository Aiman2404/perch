<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perch</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.7v12.6c0 .9 1 1.5 1.8 1l9.6-6.3c.7-.5.7-1.5 0-2L9.8 4.7C9 4.2 8 4.8 8 5.7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.2" y="4.8" width="4.2" height="14.4" rx="1.5"/><rect x="13.6" y="4.8" width="4.2" height="14.4" rx="1.5"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M4.6 6.4v11.2c0 .9 1 1.4 1.7.9l8.1-5.6c.6-.4.6-1.4 0-1.8L6.3 5.5c-.7-.5-1.7 0-1.7.9z"/><rect x="16.4" y="5.4" width="2.8" height="13.2" rx="1.4"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path d="M4.6 6.4v11.2c0 .9 1 1.4 1.7.9l8.1-5.6c.6-.4.6-1.4 0-1.8L6.3 5.5c-.7-.5-1.7 0-1.7.9z"/><rect x="16.4" y="5.4" width="2.8" height="13.2" rx="1.4"/></g></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M18.5 4.1v10.6a2.8 2.8 0 1 1-1.6-2.5V8.4l-7.6 1.6v6.9a2.8 2.8 0 1 1-1.6-2.5V6.4c0-.5.3-.9.8-1l8.9-1.9c.6-.1 1.1.3 1.1.9z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9.5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h4l2 2h7A1.5 1.5 0 0 1 20 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h2"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><path d="M8.5 12h7"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 4h4M7 7l.8 11.2A1.5 1.5 0 0 0 9.3 19.5h5.4a1.5 1.5 0 0 0 1.5-1.3L17 7M10.5 11v5M13.5 11v5"/></symbol>
      <symbol id="i-shelf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13.5l2.2-6.6A1.5 1.5 0 0 1 7.6 6h8.8a1.5 1.5 0 0 1 1.4.9l2.2 6.6V17a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17z"/><path d="M4 13.5h4.2l1.1 2h5.4l1.1-2H20"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="15" rx="2.2"/><path d="M9.5 5V4.4c0-.5.4-.9.9-.9h3.2c.5 0 .9.4.9.9V5M9 10h6M9 13.5h6M9 17h3.5"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4c0 .6.4 1 1 1h2.6l4 3.4c.6.5 1.4.1 1.4-.7V6.3c0-.8-.8-1.2-1.4-.7l-4 3.4H5c-.6 0-1 .4-1 1z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6M18.8 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
      <symbol id="i-quick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="3.5"/><rect x="4" y="13" width="7" height="7" rx="3.5"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 9.5a12.5 12.5 0 0 1 17 0M6.5 12.8a8 8 0 0 1 11 0M9.5 16a3.6 3.6 0 0 1 5 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-bt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5V20.5"/></symbol>
      <symbol id="i-micoff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 10V6.5a3 3 0 0 0-5.6-1.5M9 9.5v2a3 3 0 0 0 4.6 2.5M6 11.5a6 6 0 0 0 9.6 4.8M18 11.5c0 .6-.1 1.2-.3 1.8M12 17.5v3M4 4l16 16"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M10 3.5h4M18 7l1.2-1.2"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10.3 3.6h3.4l.5 2.3 1.6.9 2.2-.8 1.7 2.9-1.7 1.6v1.9l1.7 1.6-1.7 2.9-2.2-.8-1.6.9-.5 2.3h-3.4l-.5-2.3-1.6-.9-2.2.8-1.7-2.9 1.7-1.6v-1.9L4.3 8.9 6 6l2.2.8 1.6-.9z"/><circle cx="12" cy="12" r="2.6"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.2 2.8L5.6 13.1c-.3.4 0 1 .5 1h4.6l-1.1 7.1c-.1.6.7.9 1 .4l7.6-10.3c.3-.4 0-1-.5-1h-4.6l1.1-7.1c.1-.6-.7-.9-1-.4z"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2.5"/><circle cx="12" cy="14.5" r="3.2"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></symbol>
    </svg>

    <div id="island" data-state="idle">
      <span class="ear l"></span><span class="ear r"></span>

      <!-- Peek: hover state. Buttons control playback, anything else opens the panel. -->
      <section class="layer peek">
        <div class="art sm"><img alt="" draggable="false" /><svg class="ph"><use href="#i-note" /></svg></div>
        <div class="meta">
          <div class="title"><span data-bind="title"></span></div>
          <div class="sub" data-bind="peekSub"></div>
        </div>
        <div class="ctrls">
          <button data-act="prev" aria-label="Previous"><svg><use href="#i-prev" /></svg></button>
          <button data-act="toggle" class="pp" aria-label="Play or pause"><svg><use href="#i-play" /></svg></button>
          <button data-act="next" aria-label="Next"><svg><use href="#i-next" /></svg></button>
        </div>
      </section>

      <!-- Drop: a file is being dragged onto the island. -->
      <section class="layer drop">
        <div class="drop-icon"><svg class="tray"><use href="#i-shelf" /></svg><svg class="ok"><use href="#i-check" /></svg></div>
        <div class="meta">
          <div class="title"><span data-bind="dropTitle">Drop to keep on Shelf</span></div>
          <div class="sub" data-bind="dropSub">Let go anywhere on the island</div>
        </div>
      </section>

      <!-- Live: a running timer or the charger, shown while Perch is otherwise tucked away. -->
      <section class="layer lv">
        <svg class="lv-ic"><use href="#i-timer" /></svg>
        <span class="lv-txt" data-bind="liveText"></span>
        <i class="lv-ring"></i>
      </section>

      <!-- Panel: click state. Lines at the top switch tabs. -->
      <section class="layer panel">
        <div class="glass"><img alt="" draggable="false" /></div>
        <header>
          <span class="tab-label">Now playing</span>
          <nav class="lines"></nav>
          <div class="hdr">
            <button class="src chip" data-for="player"><i></i><span data-bind="app"></span><svg class="chev"><use href="#i-chev" /></svg></button>
            <button class="chip" data-for="apps" data-hdr="edit">Edit</button>
            <button class="chip" data-for="shelf" data-hdr="mode">Linked</button>
            <button class="chip" data-for="shelf" data-hdr="clear-shelf">Clear</button>
            <button class="chip" data-for="clipboard" data-hdr="pause">Pause</button>
            <button class="chip" data-for="clipboard" data-hdr="clear-clip">Clear</button>
            <button class="chip" data-for="sound" data-hdr="device"><span data-bind="device"></span><svg class="chev"><use href="#i-chev" /></svg></button>
            <button class="chip" data-for="quick" data-hdr="battery"><svg class="bolt"><use href="#i-bolt" /></svg><span data-bind="battery"></span></button>
          </div>
        </header>
        <div class="stage">
          <div class="tab on" data-tab="player">
            <div class="art lg">
              <img class="halo" alt="" draggable="false" />
              <img class="main" alt="" draggable="false" />
              <svg class="ph"><use href="#i-note" /></svg>
            </div>
            <div class="info">
              <div class="title"><span data-bind="title"></span></div>
              <div class="sub" data-bind="artist"></div>
              <div class="progress">
                <div class="bar"><i></i></div>
                <div class="times"><span data-bind="pos">0:00</span><span data-bind="dur">0:00</span></div>
              </div>
            </div>
            <div class="ctrls big">
              <button data-act="prev" aria-label="Previous"><svg><use href="#i-prev" /></svg></button>
              <button data-act="toggle" class="pp" aria-label="Play or pause"><svg><use href="#i-play" /></svg></button>
              <button data-act="next" aria-label="Next"><svg><use href="#i-next" /></svg></button>
            </div>
            <div class="sheet sources"></div>
          </div>

          <div class="tab" data-tab="apps">
            <div class="row apps-row"></div>
            <div class="search">
              <label class="field"><svg><use href="#i-search" /></svg><input type="text" spellcheck="false" placeholder="Search apps or type a website" /></label>
              <div class="row results"></div>
            </div>
          </div>

          <div class="tab" data-tab="shelf">
            <div class="row shelf-row"></div>
            <div class="empty-note">
              <svg><use href="#i-shelf" /></svg>
              <div><b>Shelf is empty</b><p>Drag a file onto the notch and let go.</p></div>
            </div>
            <div class="sheet actions"></div>
          </div>

          <div class="tab" data-tab="clipboard">
            <div class="row clip-row"></div>
            <div class="empty-note">
              <svg><use href="#i-clip" /></svg>
              <div><b>Nothing copied yet</b><p>Your last few copies will line up here.</p></div>
            </div>
          </div>

          <div class="tab" data-tab="sound">
            <div class="row sound-row"></div>
            <div class="empty-note">
              <svg><use href="#i-sound" /></svg>
              <div><b>Nothing is playing sound</b><p>Apps show up here while they make noise.</p></div>
            </div>
            <div class="sheet devices"></div>
          </div>

          <div class="tab" data-tab="quick">
            <div class="row quick-row"></div>
            <div class="sheet timers"></div>
          </div>
        </div>
      </section>

      <div class="vol"><i></i></div>
    </div>
  </body>
</html>
